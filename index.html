<!doctype html>
<html lang="he" dir="rtl">
<head>

<title>מספרים מרוכבים, תרגול למבחן י״ב</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@500;700&family=Noto+Serif:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
:root{--paper:#F5F7FC;--grid:#E6E9F3;--surface:#FFFFFF;--ink:#1A2242;--muted:#5A6383;--line:#D5DBEA;--re:#0D7A69;--re-soft:#E0F2EE;--im:#B3306A;--im-soft:#F9E5EE;--bad:#B42318;--bad-soft:#FCEBE9;--warn-soft:#FFF4D6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0F1328;--grid:#171D38;--surface:#171C36;--ink:#E6E9F6;--muted:#9AA3C4;--line:#2A3155;--re:#3CC6AE;--re-soft:#123430;--im:#F27BA8;--im-soft:#3A1A2B;--bad:#FF8B80;--bad-soft:#3B1D1E;--warn-soft:#3A3115;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0F1328;--grid:#171D38;--surface:#171C36;--ink:#E6E9F6;--muted:#9AA3C4;--line:#2A3155;--re:#3CC6AE;--re-soft:#123430;--im:#F27BA8;--im-soft:#3A1A2B;--bad:#FF8B80;--bad-soft:#3B1D1E;--warn-soft:#3A3115;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px;color:var(--ink);font:400 17px/1.65 "Assistant",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:24px 18px 64px}
h1,h2,h3{font-family:"Frank Ruhl Libre","David Libre",Georgia,serif;font-weight:700;line-height:1.2;margin:0}
.hero{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:6px 0 2px}
.hero h1{font-size:clamp(2.2rem,8.5vw,3.2rem);letter-spacing:-.01em}
.sub{margin:.3rem 0 0;color:var(--muted);font-size:1.05rem}
.hero-plane{width:112px;height:112px;flex:none;overflow:visible}
.intro{margin:18px 0 4px;max-width:60ch}

.alg{--gc:var(--re)}.trig{--gc:var(--im)}.geo{--gc:var(--muted)}.exam{--gc:var(--ink)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:right;background:none;border:0;border-top:1px solid var(--line);padding:14px 18px;color:inherit;font:inherit;cursor:pointer;position:relative}
.row:first-child{border-top:0}

.rt{display:flex;flex-direction:column}
.rn{font-weight:700;font-size:1.08rem}
.rd{color:var(--muted);font-size:.95rem}
.rp{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.95rem;flex:none}
.tip{margin-top:26px;color:var(--muted);font-size:.95rem}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.back{background:none;border:0;color:var(--ink);font:inherit;font-weight:600;padding:8px 0;cursor:pointer;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}

.seg button{border:0;background:none;font:inherit;font-weight:600;color:var(--muted);padding:6px 16px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 18px 20px}
.prompt p{margin:0 0 .4em}
.eq{font-family:"Noto Serif","Times New Roman",serif;direction:ltr;text-align:center;font-size:1.15rem;margin:.5em 0;overflow-x:auto;overflow-y:hidden;padding:6px 0;line-height:1.5}
.part{display:inline-block;white-space:nowrap}
.prompt .eq{font-size:1.32rem;margin:.6em 0 .8em}
.m{font-family:"Noto Serif","Times New Roman",serif;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.m i,.eq i{font-style:italic}
sup,sub{font-size:.68em;line-height:0}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.92em;margin:0 .1em;line-height:1.2}
.fr>span:first-child{border-bottom:1px solid currentColor;padding:0 .25em .1em}
.fr>span:last-child{padding:.1em .25em 0}

.arow{display:flex;align-items:center;justify-content:center;gap:8px;margin:8px 0;flex-wrap:wrap}

.in-re{border-bottom:3px solid var(--re)}.in-im{border-bottom:3px solid var(--im)}
.ai[aria-invalid="true"]{border-color:var(--bad);background:var(--bad-soft)}
.op{font-family:"Noto Serif",serif;font-size:1.2rem}
.hint{text-align:center;color:var(--muted);font-size:.9rem;margin:4px 0}
.keys{display:flex;justify-content:center;gap:6px;margin-top:10px}
.key{min-width:44px;height:40px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;font:400 1.15rem "Noto Serif",serif;cursor:pointer}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{border:0;background:var(--ink);color:var(--paper);font:700 1rem "Assistant",sans-serif;padding:.75em 1.5em;border-radius:10px;cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border:1.5px solid var(--line)}
.btn:focus-visible,.row:focus-visible,.seg button:focus-visible,.key:focus-visible,.ch:focus-visible,.back:focus-visible,summary:focus-visible{outline:2px solid var(--re);outline-offset:2px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px}
.ch{border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:.7em .5em;font:inherit;font-size:1.05rem;cursor:pointer}
.ch:disabled{cursor:default}
.choices.wide{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.ch[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink);background:var(--surface)}
.sub{margin:4px 0 16px}.sub:last-child{margin-bottom:4px}
.sq{margin:0 0 8px;font-weight:600}
.multi-ans{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.ch.right{border-color:var(--re);background:var(--re-soft)}.ch.wrong{border-color:var(--bad);background:var(--bad-soft)}
#res{scroll-margin-top:12px}
.fb{margin-top:16px;padding:10px 14px;border-radius:10px}
.fb.ok{background:var(--re-soft);border-inline-start:4px solid var(--re)}
.fb.no{background:var(--bad-soft);border-inline-start:4px solid var(--bad)}
.fb.warn{background:var(--warn-soft)}
.final{margin:12px 0 0;font-size:1.05rem}
.final>span{color:var(--muted)}
.sol{margin-top:12px;padding:12px 16px;border-radius:12px;background:var(--paper);border:1px solid var(--line)}
.sol h3{font-size:1.1rem;margin-bottom:4px}
.sol p{margin:.5em 0}
.note{color:var(--muted);font-size:.95rem}
.lbl{font-weight:700;margin-top:.9em!important}
.plane{display:block;width:min(220px,72%);margin:10px auto 2px;overflow:visible}
.ax-re{stroke:var(--re);stroke-width:1.5}.ax-im{stroke:var(--im);stroke-width:1.5}
.axl{font:italic 12px "Noto Serif",serif}.axl.re{fill:var(--re)}.axl.im{fill:var(--im)}
.vec{stroke:var(--ink);stroke-width:2}.pt{fill:var(--ink)}
.ptl{fill:var(--ink);font:italic 15px "Noto Serif",serif}
.arc{fill:none;stroke:var(--muted);stroke-width:1.5}
.hc{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:3 4}
.hero-arc{fill:none;stroke:var(--im);stroke-width:2.2;stroke-dasharray:17;stroke-dashoffset:17;animation:draw 1.3s cubic-bezier(.2,.7,.2,1) .25s forwards}
.hero-vec{transform-box:view-box;transform-origin:60px 64px;animation:spin 1.3s cubic-bezier(.2,.7,.2,1) .25s both}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes spin{from{transform:rotate(60deg)}to{transform:rotate(0deg)}}
@media (prefers-reduced-motion:reduce){.hero-arc{animation:none;stroke-dashoffset:0}.hero-vec{animation:none}}
.dots{display:flex;gap:4px;margin:0 0 14px}
.dots span{flex:1;height:6px;border-radius:3px;background:var(--line)}
.dots .ok{background:var(--re)}.dots .no{background:var(--bad)}.dots .cur{background:var(--ink)}
.big{font-family:"Frank Ruhl Libre",serif;font-size:3.2rem;font-weight:700;margin:0 0 10px;line-height:1}
.sum{list-style:none;padding:0;margin:14px 0}
.sum li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.sum li:first-child{border-top:0}
.yes{color:var(--re);font-weight:600}.nope{color:var(--bad);font-weight:600}
.again{display:flex;flex-wrap:wrap;gap:8px}
.bq{margin-top:16px}
.bq h3{font-size:1.25rem;margin-bottom:6px}
.bq>p{margin:.3em 0}
.parts{list-style-type:hebrew;padding-inline-start:1.6em;margin:10px 0 0}
.parts li{margin:14px 0}
details{margin-top:6px}
summary{cursor:pointer;color:var(--re);font-weight:600;width:fit-content}
.ex{margin-top:14px}
.exn{font-size:1.1rem;color:var(--muted);margin-bottom:6px;font-family:"Assistant",sans-serif;font-weight:700}
.ex .actions,.parts .actions{margin-top:10px}
.tog{padding:.55em 1.1em;font-size:.95rem}
.tog[aria-expanded="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.final-box{margin-top:12px;padding:10px 14px;border-radius:10px;background:var(--re-soft);border-inline-start:4px solid var(--re)}
.final-box>.al{color:var(--muted);margin-inline-end:.3em}
.subs{list-style-type:hebrew;padding-inline-start:1.6em;margin:6px 0 0}
.subs li{margin:4px 0}
.more{margin-top:26px;text-align:center}.more .actions{justify-content:center}.more p{margin:0;color:var(--muted)}
.parts .sol h3,.ex .sol h3{font-size:1.05rem}
@media (max-width:440px){.wrap{padding:16px 14px 48px}.eq{font-size:1.05rem}.prompt .eq{font-size:1.18rem}.ai{width:5.4em}.hero-plane{width:86px;height:86px}.panel{padding:16px 14px 18px}.sol{padding:10px 12px}.ttl{font-size:1.6rem}}
</style>

<body>
<main class="wrap" id="app"></main>
<script>
// ---------- utilities
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const nz=k=>{let v=0;while(!v)v=ri(-k,k);return v};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=ri(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a};
const norm=t=>((t%360)+360)%360;
const MINUS='\u2212';

class F{constructor(n,d=1){if(d<0){n=-n;d=-d}const g=gcd(n,d)||1;this.n=n/g;this.d=d/g}
 add(o){o=fr(o);return new F(this.n*o.d+o.n*this.d,this.d*o.d)}
 sub(o){o=fr(o);return new F(this.n*o.d-o.n*this.d,this.d*o.d)}
 mul(o){o=fr(o);return new F(this.n*o.n,this.d*o.d)}
 div(o){o=fr(o);return new F(this.n*o.d,this.d*o.n)}
 neg(){return new F(-this.n,this.d)}
 get v(){return this.n/this.d}
 z(){return this.n===0}}
const fr=x=>x instanceof F?x:new F(x);
class C{constructor(re,im){this.re=fr(re);this.im=fr(im)}
 add(o){return new C(this.re.add(o.re),this.im.add(o.im))}
 sub(o){return new C(this.re.sub(o.re),this.im.sub(o.im))}
 mul(o){return new C(this.re.mul(o.re).sub(this.im.mul(o.im)),this.re.mul(o.im).add(this.im.mul(o.re)))}
 conj(){return new C(this.re,this.im.neg())}
 neg(){return new C(this.re.neg(),this.im.neg())}
 abs2(){return this.re.mul(this.re).add(this.im.mul(this.im))}
 div(o){const d=o.abs2(),t=this.mul(o.conj());return new C(t.re.div(d),t.im.div(d))}}
const rc=k=>new C(nz(k),nz(k));
const pw=(c,n)=>{let r=new C(1,0);for(let i=0;i<n;i++)r=r.mul(c);return r};
const IP=[new C(1,0),new C(0,1),new C(-1,0),new C(0,-1)];

// ---------- plain math markup -> HTML
const ZB='<span class="ov"><i>z</i></span>';
const FN=new Set(['sin','cos','tan','cis','Re','Im','arg']);
function T(s){
 s=String(s);
 s=s.replace(/zb/g,'\u0001').replace(/>=/g,'\u2265').replace(/<=/g,'\u2264');
 s=s.replace(/\[([^|\[\]]*)\|([^\[\]]*)\]/g,'\u000E$1\u000F$2\u0010');
 s=s.replace(/√(\d+)/g,'\u0002$1\u0003');
 s=s.replace(/\^\{([^}]*)\}/g,'\u0004$1\u0005').replace(/\^(\d+|[a-z])/g,'\u0004$1\u0005');
 s=s.replace(/_\{([^}]*)\}/g,'\u0006$1\u0007').replace(/_(\d)/g,'\u0006$1\u0007');
 s=s.replace(/[A-Za-z]+/g,w=>FN.has(w)?w:`<i>${w}</i>`);
 s=s.replace(/-/g,MINUS).replace(/\*/g,'·');
 return s.replace(/\u0001/g,ZB).replace(/\u0002/g,'√<span class="rad">').replace(/\u0003/g,'</span>')
  .replace(/\u0004/g,'<sup>').replace(/\u0005/g,'</sup>').replace(/\u0006/g,'<sub>').replace(/\u0007/g,'</sub>')
  .replace(/\u000E/g,'<span class="fr"><span>').replace(/\u000F/g,'</span><span>').replace(/\u0010/g,'</span></span>');
}
const M=s=>`<span class="m">${T(s)}</span>`;
const E=s=>`<div class="eq">${T(s).split(/ {3}/).map(p=>p.split(' = ').map((q,j)=>`<span class="part">${j?'= ':''}${q}</span>`).join(' ')).join(' ')}</div>`;

// plain formatters
const pFm=f=>f.d===1?String(Math.abs(f.n)):`[${Math.abs(f.n)}|${f.d}]`;
const pF=f=>{f=fr(f);return (f.n<0?'-':'')+pFm(f)};
function pT(list){let o='';for(const [c0,suf] of list){const c=fr(c0);if(c.z())continue;const neg=c.n<0;const mag=(suf&&Math.abs(c.n)===1&&c.d===1)?'':pFm(c);o+=o?` ${neg?'-':'+'} ${mag}${suf}`:`${neg?'-':''}${mag}${suf}`}return o||'0'}
const pC=c=>pT([[c.re,''],[c.im,'i']]);
const pP=c=>`(${pC(c)})`;
const pPn=c=>pC(c).startsWith('-')?pP(c):pC(c);
const pN=f=>{f=fr(f);return f.n<0?`(${pF(f)})`:pF(f)};
const pSq=f=>pN(f)+'^2';
const pCo=c=>c.im.z()?pN(c.re):(c.re.z()?pPn(c):pP(c));

// surds  value = c*sqrt(k)
const S=(c,k=1)=>({c:fr(c),k});
const sv=s=>s.c.v*Math.sqrt(s.k);
const sq=s=>s.c.mul(s.c).mul(s.k);
const sAbs=s=>S(new F(Math.abs(s.c.n),s.c.d),s.k);
function mulS(a,b){if(a.k===1)return S(a.c.mul(b.c),b.k);if(b.k===1)return S(a.c.mul(b.c),a.k);if(a.k===b.k)return S(a.c.mul(b.c).mul(a.k),1);return S(a.c.mul(b.c),a.k*b.k)}
function pSm(s,suf){const n=Math.abs(s.c.n),d=s.c.d;let num=s.k===1?String(n):(n===1?'':n)+'√'+s.k;if(suf&&s.k===1&&n===1)num='';return d===1?num:`[${num||'1'}|${d}]`}
function pTS(list){let o='';for(const [s,suf] of list){if(s.c.z())continue;const neg=s.c.n<0;const mag=pSm(s,suf);const sf=(suf&&s.k>1)?' '+suf:suf;o+=o?` ${neg?'-':'+'} ${mag}${sf}`:`${neg?'-':''}${mag}${sf}`}return o||'0'}
const pSC=(a,b)=>pTS([[a,''],[b,'i']]);
const pSv=s=>pTS([[s,'']]);
const pSp=s=>{const t=pSv(s);return t.startsWith('-')?`(${t})`:t};

// trig tables
const h=new F(1,2);
const REF={0:[S(1),S(0)],30:[S(h,3),S(h)],45:[S(h,2),S(h,2)],60:[S(h),S(h,3)],90:[S(0),S(1)]};
function cs(t){t=norm(t);let ref,sc=1,ss=1;if(t<=90)ref=t;else if(t<=180){ref=180-t;sc=-1}else if(t<=270){ref=t-180;sc=-1;ss=-1}else{ref=360-t;ss=-1}
 const [c,s]=REF[ref];return [S(c.c.mul(sc),c.k),S(s.c.mul(ss),s.k)]}
const refOf=t=>{t=norm(t);return t<=90?t:t<=180?180-t:t<=270?t-180:360-t};
const quad=(x,y)=>x>0?(y>0?1:4):(y>0?2:3);
const QN=['','הראשון','השני','השלישי','הרביעי'];
const QX=(q,a)=>['',`${a}°`,`180° - ${a}°`,`180° + ${a}°`,`360° - ${a}°`][q];
const TAN={30:'[√3|3]',45:'1',60:'√3'};
const fmtA=x=>Number.isInteger(x)?String(x):x.toFixed(2);
const pA=t=>t<0?`(-${fmtA(-t)}°)`:`${fmtA(t)}°`;
const isOne=r=>r.k===1&&r.c.n===1&&r.c.d===1;
let CIS=false;
function pPol(r,t){const R=isOne(r)?'':pSm(r);const a=pA(t);if(CIS)return `${R}cis ${a}`;return R?`${R}(cos ${a} + i sin ${a})`:`cos ${a} + i sin ${a}`}
const AX45=[0,90,180,270,45,135,225,315],A30=[30,60,120,150,210,240,300,330];

// ---------- answers
const cset=list=>({type:'cset',vals:list.map(c=>[c.re.v,c.im.v]),show:list.map(c=>M(pC(c))).join('<span class="sep">,</span> ')});
const csetS=list=>({type:'cset',vals:list.map(([a,b])=>[sv(a),sv(b)]),show:list.map(([a,b])=>M(pSC(a,b))).join(', ')});
const reals=fields=>({type:'reals',fields,show:fields.map(f=>M(`${f.label} = ${f.disp??f.v}`)).join(', ')});
const polar=(r,th,show,approx=false)=>({type:'polar',r,th,approx,show:M(show)});

// ---------- plane diagram
function plane(pts,ang=true){
 let Mx=1;pts.forEach(p=>Mx=Math.max(Mx,Math.abs(p.x),Math.abs(p.y)));const k=82/Mx,cx=120,cy=110;
 let s=`<svg class="plane" viewBox="0 0 240 220" direction="ltr" role="img" aria-label="הנקודה במישור המרוכב">`;
 s+=`<line x1="14" y1="${cy}" x2="226" y2="${cy}" class="ax-re"/><line x1="${cx}" y1="208" x2="${cx}" y2="12" class="ax-im"/>`;
 s+=`<text x="226" y="${cy-7}" text-anchor="end" class="axl re">Re</text><text x="${cx+7}" y="22" class="axl im">Im</text>`;
 pts.forEach(p=>{const X=cx+p.x*k,Y=cy-p.y*k;

// ---------- step helpers
function mulSteps(z1,z2){const a=z1.re,b=z1.im,c=z2.re,d=z2.im;
 return E(`${pP(z1)}${pP(z2)} = ${pT([[a.mul(c),''],[a.mul(d),'i'],[b.mul(c),'i'],[b.mul(d),'i^2']])}`)+E(`= ${pT([[a.mul(c),''],[b.mul(d).neg(),''],[a.mul(d),'i'],[b.mul(c),'i']])} = ${pC(z1.mul(z2))}`)}
function sqSteps(z){const a=z.re,b=z.im;
 return E(`${pP(z)}^2 = ${pSq(a)} + 2*${pN(a)}*${pN(b)}i + ${pSq(b)}i^2`)+E(`= ${pT([[a.mul(a),''],[a.mul(b).mul(2),'i'],[b.mul(b).neg(),'']])} = ${pC(z.mul(z))}`)}
function divSteps(z1,z2){const cj=z2.conj(),num=z1.mul(cj),den=z2.abs2();
 return `<p>כופלים את המונה ואת המכנה בצמוד של המכנה, ${M(pC(cj))}:</p>`+E(`[${pC(z1)}|${pC(z2)}] = [${pP(z1)}${pP(cj)}|${pP(z2)}${pP(cj)}] = [${pC(num)}|${pF(den)}]`)+E(`= ${pC(z1.div(z2))}`)+`<p class="note">במכנה: ${M(`${pP(z2)}${pP(cj)} = ${pSq(z2.re)} + ${pSq(z2.im)} = ${pF(den)}`)}</p>`}
function coefP(p,sym,first){
 const one=c=>Math.abs(c.n)===1&&c.d===1;
 if(p.im.z()){const c=p.re,neg=c.n<0,mag=(sym&&one(c))?'':pFm(c);return first?`${neg?'-':''}${mag}${sym}`:` ${neg?'-':'+'} ${mag}${sym}`}
 if(p.re.z()){const c=p.im,neg=c.n<0,mag=one(c)?'':pFm(c);return first?`${neg?'-':''}${mag}i${sym}`:` ${neg?'-':'+'} ${mag}i${sym}`}
 return (first?'':' + ')+pP(p)+sym}

const optH=x=>{if(isHeb(x))return x;const m=x.match(/^(.*) (או|וגם) (.*)$/);if(m)return `${M(m[1])} ${m[2]} ${M(m[3])}`;if(x.startsWith('לכל '))return 'לכל '+M(x.slice(4));return M(x)};
function mkMulti(subs){
 return {type:'multi',subs:subs.map(s=>{const o=shuffle([...new Set(s.opts)]);const lab=LAB[s.k]||s.k;
  return {q:s.k==='none'?`עבור אילו ערכי ${M('m')} אין למשוואה פתרון?`:(s.q||`עבור אילו ערכי ${M('m')} יש למשוואה ${lab}?`),opts:o.map(optH),correct:o.indexOf(s.correct)}}),
  show:'<span class="multi-ans">'+subs.map(s=>`<span>${s.short||LAB[s.k]}: ${optH(s.correct)}</span>`).join('')+'</span>'}}
const pIntro=real=>`<p>נתונה המשוואה הבאה, כאשר ${M('m')} פרמטר ${real?'ממשי':'מרוכב'} ו־${M('z')} הנעלם:</p>`;
const mMinus=p=>{const s=pC(p.neg());return s.startsWith('-')?`m - ${s.slice(1)}`:`m + ${s}`}; // m - p
const cases=list=>list.map(([cond,txt])=>`<p><strong>${cond}</strong> ${txt}</p>`).join('');

// A: (m^2 - a^2)z = m ∓ a   (real m)
function famA(){const a=ri(1,5),sg=pick([1,-1]),inf=sg*a,non=-inf,A2=a*a,rhs=`m ${sg>0?'-':'+'} ${a}`,v=non-sg*a;
 const eq=`(m^2 - ${A2})z = ${rhs}`;
 return {prompt:pIntro(true)+E(eq),ans:mkMulti([
   {k:'one',correct:`m ≠ ±${a}`,opts:[`m ≠ ±${a}`,`m ≠ ${inf}`,`m ≠ ${non}`,'לכל m']},
   {k:'none',correct:`m = ${non}`,opts:[`m = ${non}`,`m = ${inf}`,`m = ±${a}`,NONE]},
   {k:'inf',correct:`m = ${inf}`,opts:[`m = ${inf}`,`m = ${non}`,`m = ±${a}`,NONE]}]),
  sol:`<p>מפרקים את המקדם של ${M('z')}:</p>`+E(`(m - ${a})(m + ${a})z = ${rhs}`)+`<p>המקדם מתאפס רק כאשר ${M(`m = ±${a}`)}, ולכן בודקים את שני הערכים האלה בנפרד.</p>`+
   cases([[`${M(`m ≠ ±${a}`)}:`,`מחלקים במקדם ומקבלים ${M(`z = [1|m ${sg>0?'+':'-'} ${a}]`)}. פתרון יחיד.`],

// C: mz + a·zb = c   (real m)
function famC(){const a=ri(1,3),t=pick(['re','im','both']),p=t==='im'?0:nz(6),q=t==='re'?0:nz(6),c=new C(p,q);

// ---------- answer parsing / checking
function parseNum(s){
 s=String(s).trim();if(s==='')return {empty:true};
 s=s.replace(/[\u2212\u2013\u2014]/g,'-').replace(/,/g,'.').replace(/sqrt/gi,'√').replace(/[×·]/g,'*').replace(/÷/g,'/').replace(/\s+/g,'');

 s=s.replace(/(\d|\))S/g,'$1*S').replace(/\)(?=[\dS(])/g,')*').replace(/(\d)\(/g,'$1*(');
 if(/√/.test(s)||!/^[0-9+\-*/().S]*$/.test(s))return {err:true};
 try{const v=Function('S','"use strict";return ('+s+');')(Math.sqrt);if(typeof v!=='number'||!isFinite(v))return {err:true};return {v}}catch(e){return {err:true}}
}
const near=(a,b,t)=>Math.abs(a-b)<=t+1e-3*Math.abs(b);
function checkAns(ans,raw){ // raw: {key:string}
 const keys=Object.keys(raw);if(keys.every(k=>String(raw[k]).trim()===''))return {empty:true};
 const val={};for(const k of keys){const p=parseNum(raw[k]);if(p.err)return {err:k};val[k]=p.empty?0:p.v}
 if(ans.type==='cset'){const n=ans.vals.length,u=[];for(let i=0;i<n;i++)u.push([val['re'+i],val['im'+i]]);
  const e=(p,q)=>near(p[0],q[0],.006)&&near(p[1],q[1],.006);
  const ok=n===1?e(u[0],ans.vals[0]):(e(u[0],ans.vals[0])&&e(u[1],ans.vals[1]))||(e(u[0],ans.vals[1])&&e(u[1],ans.vals[0]));return {ok}}
 if(ans.type==='reals')return {ok:ans.fields.every((f,i)=>near(val['f'+i],f.v,.006))};
 if(ans.type==='polar'){const rOk=near(val.r,ans.r,ans.approx?.02:.006);let d=norm(val.th-ans.th);if(d>180)d=360-d;const tOk=d<=(ans.approx?.6:.15);return {ok:rOk&&tOk,rOk,tOk}}
 return {ok:false};
}

  solStart=`<p>על מעגל היחידה ${M('x^2 + y^2 = 1')}:</p>`+E(`${O}^2 = 1 - (${pSv(G)})^2 = 1 - ${pF(sq(G))} = ${pF(oneMinus)}   ⇒   ${O} = ±${pSm(sAbs(Oval))}`)+
   `<p>ברביע ${QN[q]} ${M(O)} ${sv(Oval)>0?'חיובי':'שלילי'}, ולכן ${M(`${O} = ${pSv(Oval)}`)}.</p>`}
 else if(kind==='zmz'){const P=pick([[new F(1,3),S(new F(2,3),2)],[new F(2,3),S(new F(1,3),5)],[new F(1,4),S(new F(1,4),15)],[new F(3,4),S(new F(1,4),7)],[new F(3,5),S(new F(4,5))],[new F(5,13),S(new F(12,13))]]);
  q=pick([2,3,4,2,3,4,1]);const [sx,sy]=QSG[q];y=S(P[0].mul(sy));x=S(P[1].c.mul(sx),P[1].k);r=S(1);const k=y.c.mul(2);
  given=`<p>המספר המרוכב ${M('z')} נמצא על מעגל היחידה ומקיים ${M(`z - zb = ${pT([[k,'i']])}`)}.</p><p>מצאו את ההצגה הטריגונומטרית של ${M('z')}, אם נתון שהוא ברביע ${QN[q]}.</p>`;
  solStart=`<p>נציב ${M('z = x + yi')}:</p>`+E(`z - zb = (x + yi) - (x - yi) = 2yi = ${pT([[k,'i']])}   ⇒   y = ${pSv(y)}`)+
   `<p>על מעגל היחידה ${M('x^2 + y^2 = 1')}:</p>`+E(`x^2 = 1 - ${pF(sq(y))} = ${pF(sq(x))}   ⇒   x = ±${pSm(sAbs(x))}`)+`<p>ברביע ${QN[q]} ${M('x')} ${sv(x)>0?'חיובי':'שלילי'}, ולכן ${M(`x = ${pSv(x)}`)}.</p>`}
 else{const [a,b,c]=pick(RP),m=c<=13?pick([1,1,2]):1;q=pick([2,3,4,2,3,4,1]);const [sx,sy]=QSG[q];x=S(sx*a*m);y=S(sy*b*m);r=S(c*m);const R2=c*c*m*m;
  if(kind==='zpz'){given=`<p>נתון ${M(`|z| = ${c*m}`)} ו־${M(`z + zb = ${2*sx*a*m}`)}.</p><p>מצאו את ההצגה הטריגונומטרית של ${M('z')}, אם נתון שהוא ברביע ${QN[q]}.</p>`;
   solStart=`<p>נציב ${M('z = x + yi')}:</p>`+E(`z + zb = 2x = ${2*sx*a*m}   ⇒   x = ${sx*a*m}`)+E(`x^2 + y^2 = ${R2}   ⇒   y^2 = ${R2} - ${a*a*m*m} = ${b*b*m*m}   ⇒   y = ±${b*m}`)+`<p>ברביע ${QN[q]} ${M('y')} ${sy>0?'חיובי':'שלילי'}, ולכן ${M(`y = ${sy*b*m}`)}.</p>`}

   solStart=`<p>נציב ${M('z = x + yi')}:</p>`+E(`z*zb = x^2 + y^2 = ${R2}   ⇒   |z| = ${c*m}`)+E(`z - zb = 2yi = ${pT([[2*sy*b*m,'i']])}   ⇒   y = ${sy*b*m}`)+E(`x^2 = ${R2} - ${b*b*m*m} = ${a*a*m*m}   ⇒   x = ±${a*m}`)+`<p>ברביע ${QN[q]} ${M('x')} ${sx>0?'חיובי':'שלילי'}, ולכן ${M(`x = ${sx*a*m}`)}.</p>`}}

// ---------- arg / equal polar forms
const NONAX=[30,60,120,150,210,240,300,330,45,135,225,315];
const tanTxt=t=>{const r=refOf(t),neg=(norm(t)>90&&norm(t)<180)||(norm(t)>270);return (neg?'-':'')+({30:'1/√3',45:'1',60:'√3'})[r]};
function nicePoint(fn){let o,t=0;do{o=specialZ(NONAX);t++}while(!fn(o)&&t<200);return o}
function genArg(kind){

 if(kind==='argY'||kind==='argX'){const gy=kind==='argY',o=nicePoint(o=>(gy?o.b:o.a).k===1&&(gy?o.b:o.a).c.d===1),G=gy?o.b:o.a,Oth=gy?o.a:o.b;
  const zf=gy?pTS([[S(1),'x'],[G,'i']]):pTS([[G,''],[S(1),'yi']]);

   ans:info(`<span class="multi-ans"><span>א. ${M(`z = ${pSC(o.a,o.b)}`)}</span><span>ב. ${M(`z = ${pPol(o.r,o.th)}`)}</span></span>`),
   sol:`<p>${M('arg(z)')} היא הזווית ${M('θ')}, ו־${M('tan θ = [y|x]')}:</p>`+E(`tan ${o.th}° = ${tanTxt(o.th)}`)+
    (gy?E(`[${pSv(G)}|x] = ${tanTxt(o.th)}   ⇒   x = ${pSv(o.a)}`):E(`[y|${pSv(G)}] = ${tanTxt(o.th)}   ⇒   y = ${pSv(o.b)}`))+
    `<p class="note">בדיקת סימנים: הזווית ${M(o.th+'°')} ברביע ${QN[quad(sv(o.a),sv(o.b))]}, ושם ${M('x')} ${sv(o.a)>0?'חיובי':'שלילי'} ו־${M('y')} ${sv(o.b)>0?'חיובי':'שלילי'}.</p>`+
    E(`z = ${pSC(o.a,o.b)}`)+'<p>הגודל:</p>'+E(`r = √(${pF(sq(o.a))} + ${pF(sq(o.b))}) = √${pF(sq(o.r))} = ${pSm(o.r)}`)+E(`z = ${pPol(o.r,o.th)}`)+plane([{x:sv(o.a),y:sv(o.b),lab:'z'}])}}
 if(kind==='rcisX'){const o=nicePoint(o=>o.a.c.d===1&&o.b.c.d===1),[c,s]=cs(o.th);
  return {prompt:`<p>נתון ${M(`r cis ${o.th}° = ${pTS([[S(1),'x'],[o.b,'i']])}`)}. מצאו את ${M('r')} ואת ${M('x')}.</p>`,ans:info(M(`r = ${pSm(o.r)},   x = ${pSv(o.a)}`)),
   sol:'<p>פותחים את ההצגה הטריגונומטרית ומשווים חלקים:</p>'+E(`r cis ${o.th}° = r cos ${o.th}° + i*r sin ${o.th}° = ${pSp(c)}r + ${pSp(s)}r*i`)+
    `<p>חלקים מדומים:</p>`+E(`${pSp(s)}r = ${pSv(o.b)}   ⇒   r = ${pSm(o.r)}`)+'<p>חלקים ממשיים:</p>'+E(`x = r cos ${o.th}° = ${pSm(o.r)}*${pSp(c)} = ${pSv(o.a)}`)}}

  if(v==='neg'){rhs=`${k}cis(-${al}°)`;th=norm(-al);why=`<p>הזווית ${M(`-${al}°`)} שקולה ל־${M(`-${al}° + 360° = ${th}°`)}.</p>`}
  else if(v==='minusR'){rhs=`-${k}cis ${al}°`;th=norm(al+180);why=`<p>הגודל ${M('r')} חייב להיות חיובי. ${M(`-1 = cis 180°`)}, ולכן ${M(`-${k}cis ${al}° = ${k}cis(${al}° + 180°)`)}.</p>`}
  else{const big=al+360;rhs=`${k}cis ${big}°`;th=al;why=`<p>הזווית ${M(`${big}°`)} גדולה מ־${M('360°')}: ${M(`${big}° - 360° = ${al}°`)}.</p>`}

   sol:'<p>שני מספרים בהצגה טריגונומטרית שווים כאשר הגדלים שווים, והזוויות שוות עד כדי כפולה של '+M('360°')+':</p>'+E(`r = ${k},   ${n}θ = ${be}° + 360°*k`)+E(`θ = ${be/n}° + ${360/n}°*k`)+
    `<p>מציבים ${M('k = 0, 1'+(n===3?', 2':''))} כדי לקבל את כל הזוויות בתחום:</p>`+E(`θ = ${ths.map(t=>t+'°').join(',   ')}`)+`<p class="note">עבור ${M(`k = ${n}`)} כבר מקבלים ${M(`${be/n+360}° >= 360°`)}, מחוץ לתחום.</p>`}}

   `<p>מציבים ${M(`k = 0, 1, ..., ${d-1}`)}:</p>`+E(`θ = ${ths.map(t=>t+'°').join(',   ')}`)};
}

  {a:'z = 2 ± 3i',q:'פתרו את המשוואה.',sol:E('Δ = 16 - 52 = -36   ⇒   √Δ = ±6i')+E('z_{1,2} = [4 ± 6i|2] = 2 ± 3i')},

 {stem:`<p>נתונים ${M('z_1 = -√3 + i')} ו־${M('z_2 = 4cis 120°')}.</p>`,parts:[
  {a:'z_1 = 2cis 150°',q:`רשמו את ${M('z_1')} בהצגה טריגונומטרית.`,sol:E('r = √(3 + 1) = 2,   tan α = |[1|-√3]| = [√3|3]   ⇒   α = 30°')+'<p>הנקודה ברביע השני, ולכן:</p>'+E('θ = 180° - 30° = 150°')+E('z_1 = 2cis 150° = 2(cos 150° + i sin 150°)')},

  {a:'[z_2|z_1] = 2cis 330° = √3 - i',q:`חשבו את ${M('[z_2|z_1]')} בהצגה טריגונומטרית ובהצגה אלגברית.`,sol:'<p>מחלקים את הגדלים ומחסרים את הזוויות:</p>'+E('[z_2|z_1] = [4|2]cis(120° - 150°) = 2cis(-30°) = 2cis 330°')+E('= 2([√3|2] - [1|2]i) = √3 - i')},
  {a:'[z_2|i] = 4cis 30° = 2√3 + 2i',q:`חשבו את ${M('[z_2|i]')}.`,sol:E('i = cis 90°')+E('[z_2|i] = 4cis(120° - 90°) = 4cis 30° = 2√3 + 2i')},
  {a:'i',q:`חשבו את ${M('[z_2|-2zb_1]')}.`,sol:'<p>מעבירים את המכנה להצגה טריגונומטרית. לצמוד אותו גודל וזווית נגדית, ו־'+M('-2 = 2cis 180°')+':</p>'+E('zb_1 = 2cis(-150°) = 2cis 210°')+E('-2zb_1 = 2cis 180°*2cis 210° = 4cis 390° = 4cis 30°')+E('[z_2|-2zb_1] = [4|4]cis(120° - 30°) = cis 90° = i')}]},
 {stem:`<p>נתונים ${M('z_1 = a + 2i')}, כאשר ${M('a')} ממשי, ו־${M('z_2 = 1 - i')}.</p>`,parts:[

 {stem:`<p>נתונה המשוואה ${M('z^2 + |z|^2 = c')}, כאשר ${M('c')} מספר מרוכב.</p>`,parts:[
  {a:'z = ±(√2 + 2√2 i)',q:`פתרו את המשוואה עבור ${M('c = 4 + 8i')}.`,sol:`<p>נציב ${M('z = x + yi')}. האיבר ${M('y^2')} מתבטל:</p>`+E('2x^2 + 2xyi = 4 + 8i')+E('x^2 = 2   ⇒   x = ±√2,   y = [4|x]')+E('z_1 = √2 + 2√2 i,   z_2 = -√2 - 2√2 i')},
  {a:'#אינסוף פתרונות',q:`כמה פתרונות יש למשוואה עבור ${M('c = 0')}?`,sol:E('2x^2 + 2xyi = 0   ⇒   x = 0')+'<p>אין תנאי על '+M('y')+': כל מספר מדומה טהור הוא פתרון, כלומר אינסוף פתרונות.</p>'},

  {a:'#אין פתרון',q:`הראו שעבור ${M('c = -2 + i')} אין פתרון.`,sol:E('2x^2 = -2')+`<p>אין ${M('x')} ממשי שמקיים זאת, ולכן אין פתרון.</p>`}]},

  {a:'b = -2,   c = 5',q:`מצאו את ${M('b')} ואת ${M('c')}.`,sol:`<p>גם הצמוד ${M('1 - 2i')} פתרון. לפי נוסחאות ויאטה:</p>`+E('-b = (1 + 2i) + (1 - 2i) = 2   ⇒   b = -2')+E('c = (1 + 2i)(1 - 2i) = 1 + 4 = 5')},
  {a:'-6',q:`נסמן ${M('z_1 = 1 + 2i')} ו־${M('z_2 = 1 - 2i')}. חשבו את ${M('z_1^2 + z_2^2')}.`,sol:E('z_1^2 + z_2^2 = (z_1 + z_2)^2 - 2z_1z_2 = 4 - 10 = -6')},
  {a:'-[3|5] + [4|5]i',q:`חשבו את ${M('[z_1|z_2]')}.`,sol:E('[1 + 2i|1 - 2i] = [(1 + 2i)^2|5] = [-3 + 4i|5] = -[3|5] + [4|5]i')},
  {a:'w = ±(1 + 2i)',q:`מצאו את כל המספרים ${M('w')} המקיימים ${M('w^2 = -3 + 4i')}.`,sol:E('x^2 - y^2 = -3,   2xy = 4,   x^2 + y^2 = 5')+E('x^2 = 1,   y^2 = 4,   xy = 2 > 0')+E('w_1 = 1 + 2i,   w_2 = -1 - 2i')+`<p>וזה לא מקרי: בסעיף ג׳ ראינו ש־${M('(1 + 2i)^2 = -3 + 4i')}.</p>`}]},
];

function ansUI(ans){
 if(ans.type==='multi')return ans.subs.map((s,si)=>`<div class="sub"><p class="sq">${s.q}</p><div class="choices wide">${s.opts.map((o,i)=>`<button class="ch" data-act="pick" data-s="${si}" data-i="${i}" aria-pressed="false">${o}</button>`).join('')}</div></div>`).join('');
 if(ans.type==='choice')return `<div class="choices">${ans.opts.map((o,i)=>`<button class="ch" data-act="choose" data-i="${i}">${o}</button>`).join('')}</div>`;
 const inp=(k,cls,ph,al)=>`<input class="ai ${cls}" data-k="${k}" ${ph?`placeholder="${ph}"`:''} aria-label="${al}" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done">`;
 let h='';
 if(ans.type==='cset'){const n=ans.vals.length;for(let i=0;i<n;i++)h+=`<div class="arow" dir="ltr"><span class="alab">${M(n>1?`z_${i+1}`:'z')} =</span>${inp('re'+i,'in-re','ממשי','חלק ממשי')}<span class="op">+</span>${inp('im'+i,'in-im','מדומה','חלק מדומה')}<span class="op m"><i>i</i></span></div>`;
  if(n>1)h+='<p class="hint">הסדר בין הפתרונות לא משנה.</p>'}
 if(ans.type==='reals')ans.fields.forEach((f,i)=>h+=`<div class="arow" dir="ltr"><span class="alab">${M(f.label)} =</span>${inp('f'+i,'','',f.label)}</div>`);
 if(ans.type==='polar')h+=`<div class="arow" dir="ltr"><span class="alab">${M('r')} =</span>${inp('r','','','גודל')}</div><div class="arow" dir="ltr"><span class="alab">${M('θ')} =</span>${inp('th','','','זווית במעלות')}<span class="op">°</span></div><p class="hint">הזווית במעלות. כל זווית שקולה מתקבלת.</p>`;
 return h+`<div class="keys" dir="ltr">${[['√','√'],['/','/'],['-','−'],['(','('],[')',')']].map(([k,l])=>`<button class="key" data-key="${k}" tabindex="-1" aria-label="הוספת ${l}">${l}</button>`).join('')}</div>`}

function qPanel(q){return `<section class="panel"><div class="prompt">${q.prompt}</div><div class="answer" id="ansbox">${ansUI(q.ans)}</div>
 <div class="actions" id="acts">${q.ans.type==='choice'?'':'<button class="btn" data-act="check">בדיקה</button>'}<button class="btn ghost" data-act="reveal">הצג פתרון</button></div><div id="res" aria-live="polite"></div></section>`}

const PER=24;
function seeded(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const TRIGT=new Set(['toTrig','toAlg','mult']);
const cisNote=q=>CIS?Object.assign(q,{sol:`<p class="note">תזכורת: ${M('r cis θ = r(cos θ + i sin θ)')}</p>`+q.sol}):q;
function buildSet(id,set){const orig=Math.random;let h=0;for(const ch of id)h=(h*31+ch.charCodeAt(0))|0;Math.random=seeded(h+set*7919);
 for(const k in lastBank)delete lastBank[k];
 const out=[],seen=new Set();
 const trig=TRIGT.has(id);
 try{for(let n=0;n<PER;n++){const L=n<PER/3?1:n<2*PER/3?2:3;CIS=trig&&n%3===1;let q,t=0;do{q=GENS[id](L);t++}while(seen.has(q.prompt)&&t<25);seen.add(q.prompt);out.push(cisNote(q))}
  if(PLAN[id])return PLAN[id].map((x,j)=>{if(typeof x==='number')return out[x-1];CIS=j%3===1;let q,t=0;do{q=genTrigExtra(x);t++}while(seen.has(q.prompt)&&t<25);seen.add(q.prompt);return cisNote(q)})}finally{Math.random=orig;CIS=false}
 return out}
const countOf=id=>PLAN[id]?PLAN[id].length:PER;
const ansText=a=>{if(a.startsWith('#'))return a.slice(1);if(!/[\u0590-\u05FF]/.test(a))return M(a);
 return a.split(' ; ').map(seg=>{const k=seg.indexOf(': ');if(k>0&&/[\u0590-\u05FF]/.test(seg.slice(0,k)))return `${seg.slice(0,k)}: ${/[\u0590-\u05FF]/.test(seg.slice(k+2))?seg.slice(k+2):M(seg.slice(k+2))}`;return M(seg)}).join('<br>')};

function doCheck(){const c=cur(),raw={};
 if(c.q.ans.type==='multi'){const subs=[...document.querySelectorAll('#ansbox .sub')];const sel=subs.map(s=>{const b=s.querySelector('.ch[aria-pressed="true"]');return b?+b.dataset.i:-1});
  if(sel.includes(-1))return warn('בחרו תשובה בכל אחת מהשאלות.');
  let ok=true;subs.forEach((s,si)=>{const cor=c.q.ans.subs[si].correct;s.querySelectorAll('.ch').forEach((b,j)=>{if(j===cor)b.classList.add('right');else if(j===sel[si]){b.classList.add('wrong');ok=false}})});
  return finish(ok,{ok})}
 document.querySelectorAll('#ansbox .ai').forEach(el=>{raw[el.dataset.k]=el.value;el.removeAttribute('aria-invalid')});
 const r=checkAns(c.q.ans,raw);
 if(r.empty)return warn('כתבו תשובה לפני הבדיקה, או לחצו על “הצג פתרון”.');
 if(r.err){const el=document.querySelector(`#ansbox .ai[data-k="${r.err}"]`);if(el){el.setAttribute('aria-invalid','true');el.focus()}return warn(`המספר שסומן לא בפורמט מוכר. אפשר לכתוב למשל ${M('3')}, ${M('-2/5')}, ${M('2√3')} או ${M('1.5')}.`)}
 finish(r.ok,r)}
function doChoose(i){const c=cur(),ok=i===c.q.ans.correct;document.querySelectorAll('#ansbox .ch').forEach((b,j)=>{b.disabled=true;if(j===c.q.ans.correct)b.classList.add('right');else if(j===i)b.classList.add('wrong')});finish(ok,{ok})}
function doReveal(){if(st.view==='exam'){finish(false,{ok:false},true);return}showResult(null,true)}
function finish(ok,r,revealed){const c=cur();record(c.id,ok);if(st.view==='exam')c.ok=ok;showResult(r,revealed)}
function showResult(r,revealed){const c=cur();
 document.querySelectorAll('#ansbox input,#ansbox .ch').forEach(el=>el.disabled=true);
 let fb='';
 if(r&&!revealed){if(r.ok)fb='<div class="fb ok"><strong>נכון!</strong></div>';else{let x='';if(c.q.ans.type==='polar'){if(r.rOk&&!r.tOk)x=' הגודל נכון, הזווית לא.';else if(!r.rOk&&r.tOk)x=' הזווית נכונה, הגודל לא.'}fb=`<div class="fb no"><strong>לא נכון.</strong>${x} הנה הפתרון המלא.</div>`}}
 document.getElementById('res').innerHTML=fb+`<p class="final"><span>התשובה:</span> ${c.q.ans.show}</p><div class="sol"><h3>פתרון</h3>${c.q.sol}</div>`;
 const last=st.view==='exam'&&st.exam.i===st.exam.items.length-1;
 document.getElementById('acts').innerHTML=`<button class="btn" data-act="next">${st.view==='exam'?(last?'לסיכום המבחן':'השאלה הבאה'):'תרגיל הבא'}</button>`;
 const sc=document.querySelector('.score');if(sc&&st.view==='practice'){const s=st.sess[st.topic];if(s)sc.textContent=`נכון ${s.ok} מתוך ${s.n}`}
 if(st.view==='exam')renderDots();
 document.getElementById('res').scrollIntoView({behavior:reduced()?'auto':'smooth',block:'start'})}
function next(){if(st.view==='exam'){st.exam.i++;renderExam();return}st.q=GENS[st.topic](st.level[st.topic]||1);renderPractice()}

function startExam(){const ids=Object.keys(GENS),list=shuffle(ids.concat(shuffle(ids).slice(0,10-ids.length)));st.exam={i:0,items:list.map(id=>{CIS=TRIGT.has(id)&&Math.random()<.4;const q=cisNote(GENS[id](pick([2,2,3])));CIS=false;return {id,q,ok:null}})};st.view='exam';renderExam()}
function dotsHTML(){return st.exam.items.map((it,j)=>`<span class="${it.ok===true?'ok':it.ok===false?'no':j===st.exam.i?'cur':''}"></span>`).join('')}
function renderDots(){const d=document.querySelector('.dots');if(d)d.innerHTML=dotsHTML()}
function renderExam(){const ex=st.exam;
 if(ex.i>=ex.items.length){const ok=ex.items.filter(x=>x.ok).length,wrong=[...new Set(ex.items.filter(x=>!x.ok).map(x=>x.id))];
  app.innerHTML=`<nav class="top"><button class="back" data-act="home">חזרה לנושאים</button></nav><h2 class="ttl">סיכום המבחן</h2>
  <section class="panel"><p class="big"><span dir="ltr">${ok}/${ex.items.length}</span></p><div class="dots">${dotsHTML()}</div>
  <ol class="sum">${ex.items.map(x=>`<li><span>${tName(x.id)}</span><span class="${x.ok?'yes':'nope'}">${x.ok?'נכון':'לא נכון'}</span></li>`).join('')}</ol>
  ${wrong.length?`<p>כדאי לתרגל עוד:</p><div class="again">${wrong.map(id=>`<button class="btn ghost" data-act="topic" data-id="${id}">${tName(id)}</button>`).join('')}</div>`:'<p>כל התשובות נכונות. מוכנים למבחן.</p>'}
  <div class="actions"><button class="btn" data-act="exam">מבחן חדש</button></div></section>`;toTop();return}
 const it=ex.items[ex.i];
 app.innerHTML=`<nav class="top"><button class="back" data-act="home">יציאה מהמבחן</button><span class="score">שאלה ${ex.i+1} מתוך ${ex.items.length}</span></nav>
 <div class="dots">${dotsHTML()}</div><h2 class="ttl small">${tName(it.id)}</h2>${qPanel(it.q)}`;toTop()}

function renderBagrut(){st.view='bagrut';
 app.innerHTML=`<nav class="top"><button class="back" data-act="home">חזרה לנושאים</button></nav><h2 class="ttl">תרגול של כל הנושאים יחד</h2>
 <p class="intro">פתרו כל סעיף על דף, ורק אז פתחו את התשובה או את הפתרון.</p>`+
 BAGRUT.map((b,i)=>`<section class="panel bq"><h3>שאלה ${i+1}</h3>${b.stem}<ol class="parts">${b.parts.map((p,j)=>`<li><div>${p.q}</div>${revealBtns('b'+i+'-'+j,ansText(p.a),p.sol)}</li>`).join('')}</ol></section>`).join('');toTop()}

let lastInput=null;
document.addEventListener('focusin',e=>{if(e.target.matches&&e.target.matches('input.ai'))lastInput=e.target});
function insertKey(ch){let el=lastInput&&document.body.contains(lastInput)&&!lastInput.disabled?lastInput:document.querySelector('#ansbox .ai:not(:disabled)');if(!el)return;
 const s=el.selectionStart??el.value.length,e=el.selectionEnd??s;el.value=el.value.slice(0,s)+ch+el.value.slice(e);el.focus();try{el.setSelectionRange(s+ch.length,s+ch.length)}catch(_){}}
app.addEventListener('mousedown',e=>{if(e.target.closest('.key'))e.preventDefault()});
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('.ai')){e.preventDefault();doCheck()}});
app.addEventListener('click',e=>{const b=e.target.closest('[data-act],[data-key]');if(!b)return;
 if(b.dataset.key){insertKey(b.dataset.key);return}
 const a=b.dataset.act;
 if(a==='home')renderHome();else if(a==='topic')startPractice(b.dataset.id,1);else if(a==='set'){st.set=Math.max(1,st.set+(+b.dataset.d));renderPractice()}else if(a==='tog'){const el=document.getElementById(b.dataset.t);const open=el.hidden;el.hidden=!open;b.setAttribute('aria-expanded',String(open))}
 else if(a==='check')doCheck();else if(a==='reveal')doReveal();else if(a==='choose')doChoose(+b.dataset.i);else if(a==='pick'){b.parentNode.querySelectorAll('.ch').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'))}else if(a==='next')next();
 else if(a==='exam')startExam();else if(a==='bagrut')renderBagrut();else if(a==='reset'){if(confirm('לאפס את ההתקדמות בכל הנושאים?')){prog={};saveProg();renderHome()}}});
renderHome();
</script>
</body>
</html>
